version: 2

updates:
  - package-ecosystem: pip
    directory: /crackGreVocab
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /gre-vocab-front-end
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
