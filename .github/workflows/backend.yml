name: Backend

on:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".python-version"
      - "crackGreVocab/**"
      - "pyproject.toml"
  push:
    branches: [master]
    paths:
      - ".github/workflows/backend.yml"
      - ".python-version"
      - "crackGreVocab/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crack_gre_vocab
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: crackGreVocab
    env:
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crack_gre_vocab
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: crackGreVocab/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: >-
          ruff check
          crackGreVocab/config.py
          crackGreVocab/settings.py
          crackGreVocab/test_config.py
      - run: mypy crackGreVocab/config.py
      - run: python manage.py check
      - run: python manage.py test
